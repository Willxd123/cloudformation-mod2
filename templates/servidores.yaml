AWSTemplateFormatVersion: '2010-09-09'
Description: Frontend publico, backend privado y EC2 adicionales para demostrar cambios colaborativos con Git sync.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
Parameters:
  PublicSubnetId: {Type: 'AWS::EC2::Subnet::Id'}
  PrivateSubnetId: {Type: 'AWS::EC2::Subnet::Id'}
  FrontendSecurityGroupId: {Type: 'AWS::EC2::SecurityGroup::Id'}
  BackendSecurityGroupId: {Type: 'AWS::EC2::SecurityGroup::Id'}
  ImageId: {Type: 'AWS::EC2::Image::Id'}
  InstanceType:
    Type: String
    AllowedValues: [t3.micro, t3.small]
  NamePrefix:
    Type: String
    AllowedPattern: '[a-zA-Z][a-zA-Z0-9-]{0,127}'
  BackendRevision:
    Type: String
    AllowedPattern: '[a-zA-Z0-9-]{1,40}'
  FrontendRevision:
    Type: String
    AllowedPattern: '[a-zA-Z0-9-]{1,40}'
Resources:
  # Python 3 viene en la imagen Ubuntu elegida; no instalar paquetes desde esta
  # subred privada. No se despliega Django ni PostgreSQL en este ejemplo.
  Backend:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PrivateSubnetId
      SecurityGroupIds: [!Ref BackendSecurityGroupId]
      MetadataOptions: {HttpTokens: required, HttpEndpoint: enabled}
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: {VolumeSize: 8, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
      Tags:
        - {Key: Name, Value: !Sub '${NamePrefix}-backend'}
        - {Key: Revision, Value: !Ref BackendRevision}
        - {Key: ManagedBy, Value: CloudFormation}
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -eu
          command -v python3
          install -d -o nobody -g nogroup /opt/demo
          printf '%s\n' '<h1>Backend privado - CloudFormation anidado</h1>' > /opt/demo/index.html
          cat > /etc/systemd/system/demo-backend.service <<'SERVICE'
          [Unit]
          Description=Backend privado de demostracion
          After=network.target
          [Service]
          User=nobody
          Group=nogroup
          WorkingDirectory=/opt/demo
          ExecStart=/usr/bin/python3 -m http.server 8080 --bind 0.0.0.0
          Restart=always
          [Install]
          WantedBy=multi-user.target
          SERVICE
          systemctl daemon-reload
          systemctl enable --now demo-backend
  Frontend:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PublicSubnetId
      SecurityGroupIds: [!Ref FrontendSecurityGroupId]
      MetadataOptions: {HttpTokens: required, HttpEndpoint: enabled}
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: {VolumeSize: 8, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
      Tags:
        - {Key: Name, Value: !Sub '${NamePrefix}-frontend'}
        - {Key: Revision, Value: !Ref FrontendRevision}
        - {Key: ManagedBy, Value: CloudFormation}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y nginx
          printf '%s\n' '<h1>Frontend - CloudFormation</h1><a href="/backend/">Probar backend privado</a>' > /var/www/html/index.html
          cat > /etc/nginx/sites-available/default <<'NGINX'
          server {
            listen 80 default_server;
            root /var/www/html;
            location /backend/ {
              proxy_pass http://${Backend.PrivateIp}:8080/;
            }
          }
          NGINX
          nginx -t
          systemctl enable nginx
          systemctl restart nginx
  # Integrante A: agregar esta EC2 al mismo stack, sin modificar las existentes.
  # Reutiliza red y firewall privados; no abre puertos ni instala aplicaciones.
  PruebaIntegranteA:
    Type: AWS::EC2::Instance
    Metadata:
      com.aws.cloudformation.Context:
        why: Demostrar creacion colaborativa de un recurso mediante Git sync.
        must:
          - Conservar Backend y Frontend al incorporar cambios del integrante B.
          - Mantener esta instancia privada y usar logical IDs distintos para nuevas EC2.
    Properties:
      ImageId: !Ref ImageId
      InstanceType: t3.micro
      SubnetId: !Ref PrivateSubnetId
      SecurityGroupIds: [!Ref BackendSecurityGroupId]
      MetadataOptions: {HttpTokens: required, HttpEndpoint: enabled}
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: {VolumeSize: 8, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
      Tags:
        - {Key: Name, Value: !Sub '${NamePrefix}-prueba-a'}
        - {Key: Integrante, Value: A}
        - {Key: ManagedBy, Value: CloudFormation}
Outputs:
  FrontendUrl:
    Description: URL HTTP de laboratorio, sin login ni informacion sensible.
    Value: !Sub 'http://${Frontend.PublicIp}'
  BackendId:
    Description: EC2 backend privada.
    Value: !Ref Backend
  FrontendId:
    Description: EC2 frontend publica.
    Value: !Ref Frontend
  BackendPrivateIp:
    Description: Direccion interna usada por el proxy Nginx.
    Value: !GetAtt Backend.PrivateIp
  PruebaIntegranteAId:
    Description: Nueva EC2 privada agregada por el integrante A.
    Value: !Ref PruebaIntegranteA
